name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Run the Node tooling on Bun
        # Lifecycle scripts (workerd's postinstall) call `node`; this `node` is Bun, so nothing runs on the runner's Node.
        run: |
          mkdir -p "$RUNNER_TEMP/bun-as-node"
          ln -s "$(command -v bun)" "$RUNNER_TEMP/bun-as-node/node"
          echo "$RUNNER_TEMP/bun-as-node" >> "$GITHUB_PATH"
      - run: node -e 'if (!globalThis.Bun) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Deploy
        working-directory: packages/gawdigital
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Wrangler runs on Bun (`--bun`), not on the runner's Node.
        run: bun run deploy
