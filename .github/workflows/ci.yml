name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Run the Node tooling on Bun
        # Lifecycle scripts (workerd's postinstall) call `node`; this `node` is Bun, so nothing runs on the runner's Node.
        run: |
          mkdir -p "$RUNNER_TEMP/bun-as-node"
          ln -s "$(command -v bun)" "$RUNNER_TEMP/bun-as-node/node"
          echo "$RUNNER_TEMP/bun-as-node" >> "$GITHUB_PATH"
      - run: node -e 'if (!globalThis.Bun) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
        env:
          # A public build-time value (a repository variable, not a secret); unset, the Turnstile test key is used.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Upload a preview version
        # Secrets are not available to pull requests from forks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        working-directory: packages/gawdigital
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Wrangler runs on Bun (`--bun`), not on the runner's Node. An explicit `shell: bash` adds `-o pipefail`,
        # so a failing upload fails the step instead of being masked by `tee`.
        shell: bash
        run: >-
          bun --bun wrangler versions upload
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "PR #${{ github.event.pull_request.number }}"
          | tee "$RUNNER_TEMP/preview.txt"
      - name: Report the preview
        if: steps.preview.outcome == 'success'
        run: |
          OUTPUT=$(cat "$RUNNER_TEMP/preview.txt")
          {
            echo '### Preview'
            echo '```'
            echo "$OUTPUT" | grep -iE 'preview|version id' || echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
