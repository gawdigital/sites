name: CI

on:
  pull_request:

permissions:
  contents: read
  # The preview step comments on the pull request.
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Run the Node tooling on Bun
        # Lifecycle scripts (workerd's postinstall) call `node`; this `node` is Bun, so nothing runs on the runner's Node.
        run: |
          mkdir -p "$RUNNER_TEMP/bun-as-node"
          ln -s "$(command -v bun)" "$RUNNER_TEMP/bun-as-node/node"
          echo "$RUNNER_TEMP/bun-as-node" >> "$GITHUB_PATH"
      - run: node -e 'if (!globalThis.Bun) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
        env:
          # gawdigital's public build-time value (a repository variable, not a secret); unset, the Turnstile test key
          # is used. gawgroup's site key is in its `src/env.ts`.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          # The CMS project the pages read at build time (repository variables); unset, the translation files' copy.
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      - name: Build the Sanity studio
        # Catches a schema the studio cannot load; the studio itself is deployed by the owner (`sanity/README.md`).
        run: bun run --filter studio build
      - name: Upload a preview version of gawdigital
        # Secrets are not available to pull requests from forks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        working-directory: packages/gawdigital
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON line per command here; the upload's line names the preview URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-gawdigital.ndjson
        # Wrangler runs on Bun (`--bun`), not on the runner's Node.
        run: >-
          bun --bun wrangler versions upload
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "PR #${{ github.event.pull_request.number }}"
      - name: Upload a preview version of gawgroup
        # An upload only adds a version to the Worker: it needs the Worker `gawgroup` to exist, not its domain. A
        # failure here is shown on the step but does not fail gawdigital's checks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview-gawgroup
        continue-on-error: true
        working-directory: packages/gawgroup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-gawgroup.ndjson
        run: >-
          bun --bun wrangler versions upload
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "PR #${{ github.event.pull_request.number }}"
      - name: Upload a preview version of gawstudio
        # As for gawgroup: it needs the Worker `gawstudio` to exist, and a failure does not fail the checks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview-gawstudio
        continue-on-error: true
        working-directory: packages/gawstudio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-gawstudio.ndjson
        run: >-
          bun --bun wrangler versions upload
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "PR #${{ github.event.pull_request.number }}"
      - name: Comment the preview links on the pull request
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@v8
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        with:
          script: |
            const fs = require('node:fs');
            // One row pair per site whose upload wrote its line; all but gawdigital's may be missing (their steps may fail).
            const uploadOf = (site) => {
              const file = `${process.env.OUTPUT_DIR}/wrangler-${site}.ndjson`;
              if (!fs.existsSync(file)) return undefined;
              return fs.readFileSync(file, 'utf8')
                .split('\n').filter(Boolean).map((line) => JSON.parse(line))
                .findLast((entry) => entry.type === 'version-upload');
            };
            const uploads = ['gawdigital', 'gawgroup', 'gawstudio'].map((site) => [site, uploadOf(site)]);
            if (!uploads[0][1]) throw new Error('Wrangler reported no version upload.');

            const sha = context.payload.pull_request.head.sha;
            const marker = '<!-- preview-links -->';
            const body = [
              marker,
              '### Preview',
              '',
              '| Site | | URL |',
              '| --- | --- | --- |',
              ...uploads.flatMap(([site, upload]) => !upload ? [
                `| ${site} | No preview: the upload failed, see the workflow run. | — |`,
              ] : !upload.preview_url && !upload.preview_alias_url ? [
                // Preview URLs are a setting of the Worker that only a deploy applies (`preview_urls`).
                `| ${site} | Uploaded, but the Worker's preview URLs are off until its first deploy. | — |`,
              ] : [
                `| ${site} | This pull request (follows every push) | ${upload.preview_alias_url ?? '—'} |`,
                `| ${site} | This commit (${sha.slice(0, 7)}) | ${upload.preview_url ?? '—'} |`,
              ]),
              '',
              uploads.filter(([, upload]) => upload).map(([site, upload]) => `${site} version \`${upload.version_id}\`.`).join(' '),
            ].join('\n');
            await core.summary.addRaw(body.replace(marker, '')).write();

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
